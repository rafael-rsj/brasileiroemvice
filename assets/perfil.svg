<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b3d"/>
      <stop offset="0.35" stop-color="#6a1b6e"/>
      <stop offset="0.62" stop-color="#ff3d7f"/>
      <stop offset="0.82" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffc145"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ff5e62"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b0f4c"/>
      <stop offset="1" stop-color="#0d0624"/>
    </linearGradient>
    <clipPath id="sunclip">
      <rect x="0" y="0" width="1080" height="250"/>
      <rect x="0" y="262" width="1080" height="22"/>
      <rect x="0" y="296" width="1080" height="18"/>
      <rect x="0" y="326" width="1080" height="14"/>
      <rect x="0" y="352" width="1080" height="10"/>
      <rect x="0" y="374" width="1080" height="8"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="palm" viewBox="0 0 200 420">
      <path d="M100 420 C96 330 92 250 104 160 L114 160 C104 250 110 330 116 420 Z" fill="#12061f"/>
      <g fill="#12061f">
        <path d="M108 160 C70 120 30 118 0 140 C40 120 75 130 108 168 Z"/>
        <path d="M108 160 C80 100 40 80 8 82 C50 92 80 115 106 166 Z"/>
        <path d="M110 160 C120 100 150 70 190 66 C150 85 128 115 112 166 Z"/>
        <path d="M110 160 C150 125 185 128 200 150 C170 135 140 140 112 168 Z"/>
        <path d="M108 160 C104 110 112 70 130 40 C122 80 118 120 112 164 Z"/>
      </g>
    </symbol>
  </defs>

  <!-- sky -->
  <rect width="1080" height="1080" fill="url(#sky)"/>

  <!-- sun -->
  <g clip-path="url(#sunclip)" transform="translate(0,300)">
    <circle cx="540" cy="300" r="250" fill="url(#sun)" filter="url(#glow)"/>
  </g>

  <!-- sea -->
  <rect x="0" y="690" width="1080" height="390" fill="url(#sea)"/>
  <g stroke="#ff5ea8" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round">
    <line x1="330" y1="720" x2="750" y2="720"/>
    <line x1="380" y1="752" x2="700" y2="752"/>
    <line x1="430" y1="782" x2="650" y2="782"/>
  </g>

  <!-- palms -->
  <use href="#palm" x="-10" y="300" width="300" height="630"/>
  <use href="#palm" x="820" y="360" width="250" height="540" transform="scale(-1,1) translate(-1890,0)"/>

  <!-- Brazil stripe -->
  <g transform="translate(540,880)">
    <rect x="-210" y="-34" width="420" height="68" rx="34" fill="#009c3b"/>
    <path d="M-150 0 L0 -26 L150 0 L0 26 Z" fill="#ffdf00"/>
    <circle cx="0" cy="0" r="17" fill="#002776"/>
  </g>

  <!-- coqueiro do boné do Tio Vice -->
  <symbol id="logo" viewBox="0 0 400 460">
    <g>
      <path d="M196 150 C190 230 176 330 150 452 L196 452 C214 340 222 240 214 152 Z"/>
      <path d="M205 150 C160 100 90 92 26 130 C92 112 150 128 196 172 Z"/>
      <path d="M205 146 C176 74 112 34 44 40 C112 66 160 104 192 168 Z"/>
      <path d="M208 146 C214 76 252 26 306 6 C262 50 238 98 222 166 Z"/>
      <path d="M210 148 C262 96 328 88 384 118 C324 112 268 130 222 172 Z"/>
      <path d="M210 152 C268 150 330 186 362 246 C316 202 262 184 218 178 Z"/>
      <path d="M204 152 C146 154 86 192 58 250 C104 206 156 186 198 178 Z"/>
      <circle cx="190" cy="168" r="13"/><circle cx="216" cy="172" r="12"/><circle cx="202" cy="186" r="11"/>
    </g>
  </symbol>
  <g transform="translate(10,16)" fill="#0d0624" opacity="0.55"><use href="#logo" x="300" y="150" width="480" height="552"/></g>
  <g fill="#ffffff" stroke="#0d0624" stroke-width="7" paint-order="stroke" stroke-linejoin="round"><use href="#logo" x="300" y="150" width="480" height="552"/></g>
</svg>