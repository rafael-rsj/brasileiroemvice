<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url("{{FONTS}}/Anton-Regular.ttf")}
@font-face{font-family:InterB;src:url("{{FONTS}}/Inter-Bold.otf")}
@font-face{font-family:InterM;src:url("{{FONTS}}/Inter-Medium.otf")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden;background:#0d0624}
.wrap{position:relative;width:100%;height:100%;overflow:hidden}
.bg{position:absolute;inset:0;background:linear-gradient(180deg,#1a0b3d 0%,#6a1b6e 45%,#ff3d7f 80%,#ff8a3d 100%);}
.bg img,.bg svg{width:100%;height:100%;object-fit:cover;display:block}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,6,36,.55) 0%,rgba(13,6,36,0) 22%,rgba(13,6,36,0) 38%,rgba(13,6,36,.88) 64%,#0d0624 100%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px);mix-blend-mode:overlay}
/* HUD topo */
.top{position:absolute;top:44px;left:48px;right:48px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:76px;height:76px;border-radius:50%;border:4px solid #fff}
.brand .n{font-family:Anton;color:#fff;font-size:38px;letter-spacing:1px;line-height:1;text-shadow:0 3px 0 #0d0624}
.brand .s{font-family:InterB;color:#ffc145;font-size:20px;letter-spacing:3px;margin-top:6px}
.live{font-family:InterB;font-size:22px;letter-spacing:3px;color:#fff;background:#ff2d55;padding:12px 20px;border-radius:8px;display:flex;align-items:center;gap:10px;box-shadow:0 0 0 4px rgba(255,45,85,.3)}
.live i{width:14px;height:14px;border-radius:50%;background:#fff;display:block}
/* Estrelas de procurado (elemento de HUD original) */
.stars{position:absolute;top:150px;right:48px;display:flex;gap:8px}
.stars span{font-size:40px;color:#ffc145;text-shadow:0 2px 0 #0d0624}
.stars span.off{color:rgba(255,255,255,.25)}
/* Radar */
.radar{position:absolute;left:48px;top:150px;width:120px;height:120px;border-radius:50%;border:5px solid #fff;background:radial-gradient(circle,#2b0f4c 0 55%,#1a0b3d 100%);overflow:hidden;opacity:.9}
.radar:before{content:"";position:absolute;inset:0;background:conic-gradient(from 20deg,rgba(255,61,127,.55),transparent 25%)}
.radar b{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;background:#ffc145;transform:rotate(45deg)}
.radar em{position:absolute;width:10px;height:10px;border-radius:50%;background:#ff3d7f;left:68%;top:30%}
/* Conteúdo */
.content{position:absolute;left:48px;right:48px;bottom:{{CONTENT_B}}px}
.tag{display:inline-block;font-family:InterB;font-size:26px;letter-spacing:4px;padding:10px 22px;border-radius:6px;margin-bottom:22px;color:#0d0624}
.tag.NOTICIA{background:#ffc145}.tag.OFICIAL{background:#2ee59d}.tag.RUMOR{background:#ff5e62;color:#fff}.tag.COMPARACAO{background:#7b61ff;color:#fff}.tag.CURIOSIDADE{background:#00d4ff}
h1{font-family:Anton;color:#fff;font-size:{{FS}}px;line-height:1.04;text-transform:uppercase;letter-spacing:.5px;text-shadow:0 4px 0 #0d0624}
h1 mark{background:none;color:#ffc145}
.sub{font-family:InterM;color:rgba(255,255,255,.88);font-size:30px;line-height:1.35;margin-top:22px}
/* Rodapé HUD */
.foot{position:absolute;left:0;right:0;bottom:0;height:86px;background:linear-gradient(90deg,#ff3d7f,#ff8a3d);display:flex;align-items:center;justify-content:space-between;padding:0 48px;font-family:InterB;color:#0d0624;font-size:24px;letter-spacing:1px}
.foot .br{display:flex;align-items:center;gap:12px}
.flag{width:46px;height:30px;border-radius:5px;background:#009c3b;position:relative}
.flag:before{content:"";position:absolute;left:7px;top:4px;width:32px;height:22px;background:#ffdf00;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.flag:after{content:"";position:absolute;left:16px;top:8px;width:14px;height:14px;border-radius:50%;background:#002776}
.ai{position:absolute;right:48px;bottom:104px;font-family:InterB;font-size:18px;letter-spacing:2px;color:rgba(255,255,255,.7);border:2px solid rgba(255,255,255,.4);padding:6px 12px;border-radius:6px}

/* ===== temas (cor de destaque + rodapé) ===== */
.wrap{--acc:#ffc145;--f1:#ff3d7f;--f2:#ff8a3d}
.t-miami{--acc:#22e1ff;--f1:#ff6f91;--f2:#22e1ff}
.t-night{--acc:#c9a7ff;--f1:#7b3cff;--f2:#ff3d9a}
.t-golden{--acc:#ffcf4a;--f1:#ff7b39;--f2:#ffcf4a}
h1 mark{color:var(--acc)!important}
.brand .s{color:var(--acc)!important}
.stars span{color:var(--acc)}
.foot{background:linear-gradient(90deg,var(--f1),var(--f2))!important}
/* ===== layout TOPO: manchete em cima, cenário embaixo ===== */
.l-top .shade{background:linear-gradient(180deg,#0d0624 0%,rgba(13,6,36,.92) 30%,rgba(13,6,36,.35) 55%,rgba(13,6,36,0) 72%,rgba(13,6,36,.55) 100%)}
.l-top .content{top:170px;bottom:auto}
.l-top .radar{display:none}
.l-top .stars{top:auto;bottom:110px;right:48px}
/* ===== layout CAIXA: tarja de plantão no meio-baixo ===== */
.l-box .shade{background:linear-gradient(180deg,rgba(13,6,36,.5) 0%,rgba(13,6,36,0) 20%,rgba(13,6,36,0) 50%,rgba(13,6,36,.6) 100%)}
.l-box .content{left:36px;right:36px;padding:34px 36px 38px;background:rgba(13,6,36,.82);border:4px solid var(--acc);border-radius:22px;box-shadow:0 0 0 6px rgba(0,0,0,.25),0 0 40px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
.l-box .tag{position:absolute;top:-26px;left:30px;margin:0}
.l-box h1{margin-top:12px}

/* ===== CAPA estilo portal: foto cheia, selo e manchete centralizados ===== */
.l-center .shade{background:linear-gradient(180deg,rgba(13,6,36,.35) 0%,rgba(13,6,36,0) 18%,rgba(13,6,36,0) 48%,rgba(13,6,36,.85) 72%,#0d0624 100%)}
.l-center .content{text-align:center}
.l-center .tag{background:none!important;color:var(--acc)!important;padding:0;letter-spacing:6px;font-size:28px;margin-bottom:14px}
.l-center h1{font-size:calc({{FS}}px * 1.05)}
.l-center .sub{display:none}
.l-center .radar,.l-center .stars{display:none}
/* ===== SLIDE de detalhes ===== */
.l-detail .shade{background:linear-gradient(180deg,rgba(13,6,36,.45) 0%,rgba(13,6,36,.15) 30%,rgba(13,6,36,.9) 55%,#0d0624 75%)}
.l-detail .radar,.l-detail .stars,.l-detail .tag{display:none}
.l-detail h1{font-family:InterB;text-transform:none;font-size:52px;line-height:1.15;letter-spacing:0}
.l-detail .sub{font-size:36px;line-height:1.45;color:#fff;margin-top:26px}
.l-detail .sign{font-family:InterB;color:#fff;font-size:30px;margin-top:34px}
.l-detail .sign small{display:block;font-family:InterM;color:rgba(255,255,255,.7);font-size:22px;margin-top:6px}
/* ===== SLIDE final (siga) ===== */
.l-cta .content{text-align:center;bottom:50%;transform:translateY(50%)}
.l-cta .tag,.l-cta .radar,.l-cta .stars{display:none}
.l-cta .shade{background:rgba(13,6,36,.55)}
.credit{position:absolute;right:48px;top:150px;font-family:InterB;font-size:18px;letter-spacing:2px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.35);padding:6px 12px;border-radius:6px}
</style></head>
<body><div class="wrap {{LAYOUT}} {{THEME}}">
  <div class="bg">{{BG}}</div>
  <div class="shade"></div><div class="scan"></div>
  <div class="top">
    <div class="brand"><img src="{{ASSETS}}/perfil.png"><div><div class="n">BRASILEIRO EM VICE</div><div class="s">{{KICKER}}</div></div></div>
    <div class="live"><i></i>{{LIVE}}</div>
  </div>
  <div class="stars">{{STARS}}</div>
  <div class="radar"><b></b><em></em></div>
  <div class="content">
    <div class="tag {{TAG}}">{{TAG_LABEL}}</div>
    <h1>{{TITLE}}</h1>
    <div class="sub">{{SUB}}</div>
    {{SIGN}}
  </div>
  {{AI}}
  {{CREDIT}}
  <div class="foot"><div class="br"><div class="flag"></div>@brasileiroemvice</div><div>{{SOURCE}}</div></div>
</div></body></html>
