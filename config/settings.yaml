# guizo — o que acontece em Cascavel (PR). Configuração central do robô.

# false = robô pausado (só roda modo teste). Mude para true para começar a publicar.
ativo: true

perfil:
  usuario: guizocascavel
  nome: "guizo"
  cidade: "Cascavel"
  hashtags_fixas: ["#Cascavel", "#CascavelPR", "#guizo"]

ia:
  modelo: "auto"   # auto = Sonnet mais novo disponível na conta
  max_tokens: 1500

# Uma notícia só entra se citar Cascavel (ou um lugar conhecido da cidade)
palavras_chave: ["cascavel", "lago municipal", "show rural", "catuaí shopping", "jl shopping", "unioeste cascavel",
                 "teatro municipal de cascavel", "parque tarquínio", "avenida brasil", "rua paraná", "transitar"]

# Palavras que barram a notícia de vez (caso policial que repercutiu pode entrar; estes temas não)
bloqueados: ["suicíd", "estupro", "pedofil", "abuso sexual", "cadáver", "corpo encontrado", "esquartej",
             "candidato", "eleição", "partido", "deputado", "vereador critica"]

# Fontes de notícia. confiavel=true: veículo local conhecido
fontes:
  - {nome: "CGN", url: "https://cgn.inf.br/feed/", confiavel: true, local: true}
  - {nome: "Catve", url: "https://catve.com/feed/", confiavel: true, local: true}
  - {nome: "O Paraná", url: "https://oparana.com.br/feed/", confiavel: true}
  - {nome: "Radar BO", url: "https://radarbo.com.br/feed/", confiavel: true}
  - {nome: "Tarobá", url: "https://taroba.com.br/feed", confiavel: true}
  - {nome: "Band B", url: "https://www.bandab.com.br/feed/", confiavel: true}
  - {nome: "Prefeitura (Google)", url: "https://news.google.com/rss/search?q=site:cascavel.pr.gov.br+when:3d&hl=pt-BR&gl=BR&ceid=BR:pt-419", confiavel: true, local: true}
  - {nome: "Bing Cascavel", url: "https://www.bing.com/news/search?q=Cascavel+Paran%C3%A1&format=rss&setlang=pt-BR", confiavel: false}
  - {nome: "Bing novidades", url: "https://www.bing.com/news/search?q=Cascavel+inaugura%C3%A7%C3%A3o+OR+abre+OR+novo&format=rss&setlang=pt-BR", confiavel: false}
  - {nome: "Bing repercussão", url: "https://www.bing.com/news/search?q=Cascavel+pol%C3%ADcia+OR+pol%C3%AAmica+OR+viraliza+OR+flagra&format=rss&setlang=pt-BR", confiavel: false}
  - {nome: "Google Cascavel", url: "https://news.google.com/rss/search?q=Cascavel+Paran%C3%A1+when:2d&hl=pt-BR&gl=BR&ceid=BR:pt-419", confiavel: false}
  - {nome: "Google novidades", url: "https://news.google.com/rss/search?q=Cascavel+(inaugura+OR+abre+OR+novo+OR+nova+OR+inaugura%C3%A7%C3%A3o)+when:3d&hl=pt-BR&gl=BR&ceid=BR:pt-419", confiavel: false}
  - {nome: "Google trânsito", url: "https://news.google.com/rss/search?q=Cascavel+(tr%C3%A2nsito+OR+interdi%C3%A7%C3%A3o+OR+falta+de+%C3%A1gua+OR+bloqueio+OR+pol%C3%ADcia)+when:3d&hl=pt-BR&gl=BR&ceid=BR:pt-419", confiavel: false}
  - {nome: "Google eventos", url: "https://news.google.com/rss/search?q=Cascavel+(show+OR+festival+OR+feira+OR+evento+OR+festa)+when:5d&hl=pt-BR&gl=BR&ceid=BR:pt-419", confiavel: false}

# Páginas de onde sai a agenda do fim de semana (lidas com navegador, o texto vai para a IA)
agenda:
  - {nome: "Sympla", url: "https://www.sympla.com.br/eventos/cascavel-pr"}
  - {nome: "Rolê Agora", url: "https://www.roleagora.com.br/city/cascavel-pr"}
  - {nome: "Vem Ver Cascavel", url: "https://vemvercascavel.com.br/"}
  - {nome: "Blueticket", url: "https://www.blueticket.com.br/eventos/cascavel"}
  - {nome: "Notícias de eventos", url: "https://www.bing.com/news/search?q=Cascavel+PR+show+OR+festival+OR+feira+OR+evento&format=rss&setlang=pt-BR"}
  - {nome: "Google eventos", url: "https://news.google.com/rss/search?q=Cascavel+(show+OR+festival+OR+feira+OR+evento)+when:7d&hl=pt-BR&gl=BR&ceid=BR:pt-419"}

seguranca:
  idade_maxima_horas: 30
  fontes_minimas_para_fato: 1

clima:   # Open-Meteo (grátis, sem chave)
  lat: -24.9555
  lon: -53.4552

# Radar de posts em alta (comentários prontos no Telegram). Só funciona com perfis comerciais/criadores.
radar_limite_dia: 25
radar_perfis: [noticiascascavel, cascavelemfatos, rolezandocascavel, cascavel_prefa, tour.cascavel, cascavel.spotted,
               catuaipalladium, festvalcascavel, baladascascavelense, frajolacascaveloficial, magnata.boteco,
               esquentapubcascavel, comancheamericanpub, likebaroficial, terrazzorooftopbar, cinelasercascavel]
