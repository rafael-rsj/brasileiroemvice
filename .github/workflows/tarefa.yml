name: Tarefas (galeria, Tio Vice, atualização)
on:
  workflow_dispatch:
    inputs:
      comando:
        description: "galeria = baixa as imagens oficiais | recortar = poses do Tio Vice feitas no ChatGPT | mascote = gera no Gemini"
        type: choice
        options: [galeria, recortar, mascote]
        default: galeria
      refazer:
        description: "Só para o mascote: refazer tudo do zero (1 = sim)"
        default: "0"
  push:
    paths: ["patch/**"]
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  aplicar:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplica a atualização enviada em patch/
        run: |
          git config user.name brasileiroemvice-bot
          git config user.email bot@users.noreply.github.com
          for f in patch/*.b64; do
            rm -rf /tmp/p && mkdir -p /tmp/p
            if base64 -d "$f" | tar -xzf - -C /tmp/p 2>/dev/null; then
              if [ -f /tmp/p/remove.txt ]; then xargs -a /tmp/p/remove.txt git rm -rq --ignore-unmatch; fi
              for p in /tmp/p/*.patch; do git apply --whitespace=nowarn -v "$p"; done
            else
              base64 -d "$f" | gunzip | git apply --whitespace=nowarn -v
            fi
          done
          git rm -rq patch
          git add -A
          git commit -m "atualização do robô"
          git push
  tarefa:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt scipy
      - run: if [ "${{ inputs.comando }}" = recortar ]; then python src/mascot_cut.py; else python src/main.py ${{ inputs.comando }}; fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REFAZER: ${{ inputs.refazer }}
